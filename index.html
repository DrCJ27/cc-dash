<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>The Program</title>

<style>
/* THE PROGRAM -- WODprep brand: navy ground, gold primary, cyan secondary.
   Single dark design on purpose: this is CJ's night surface. */
:root{--ground:#0A1D2A;--surface:#10273A;--surface-2:#16304A;--ink:#F2F6F9;--ink-2:#C3D2DD;
--muted:#7E95A8;--line:#1E3B52;--accent:#FFC847;--accent-ink:#0A1D2A;--accent-soft:#2B2410;
--cyan:#76D7EA;--teal:#29ACC9;--crit:#FF8075;--crit-soft:#3A1713;--warn:#FFC847;--warn-soft:#30260C;
--ok:#4FE0AC;--ok-soft:#0E2E22;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
font:16px/1.5 Archivo,ui-sans-serif,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:840px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 72px;display:flex;flex-direction:column;gap:16px}
.kicker{font:600 12px/1 Oswald,ui-sans-serif,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.kicker em{font-style:normal;color:var(--muted)}
h1{margin:2px 0 0;font:400 clamp(34px,9vw,52px)/1.02 Anton,ui-sans-serif,sans-serif;letter-spacing:.015em;text-transform:uppercase}
.sub{color:var(--ink-2);font-size:15px;margin-top:6px;max-width:560px}
.stamp{font:500 12.5px/1.45 Oswald,ui-sans-serif,sans-serif;letter-spacing:.04em;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
border-radius:999px;padding:.42rem .95rem;font:600 13px/1 Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card.gold{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.clabel{font:600 12px/1 Oswald,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.clabel .r{color:var(--muted);letter-spacing:.06em}
.big{font:400 30px/1.05 Anton,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.big .gold{color:var(--accent)}
.ladder{display:flex;gap:8px;margin:12px 0 6px}
.rung{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 10px;text-align:center;color:var(--muted)}
.rung b{display:block;font:600 14px/1 Oswald,sans-serif;letter-spacing:.1em;color:var(--ink-2)}
.rung span{font:500 12px/1 Oswald,sans-serif;letter-spacing:.05em}
.rung.live{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.rung.live b{color:var(--accent)}
.rung.gone{opacity:.38}
.cta{display:block;width:100%;margin-top:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
padding:.95rem;font:600 17px/1 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.cta:active{transform:translateY(1px)}
.won{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-top:10px}
.won .lvl{font:400 34px/1 Anton,sans-serif;color:var(--accent);text-transform:uppercase}
.won .d{color:var(--ink-2);font-size:14.5px}
.weekstrip{display:flex;gap:6px;margin-top:12px}
.weekstrip div{flex:1;text-align:center;border:1px solid var(--line);border-radius:7px;padding:6px 0;
font:600 12px/1.3 Oswald,sans-serif;letter-spacing:.06em;color:var(--muted)}
.weekstrip div.today{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.weekstrip div.off{opacity:.45}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.count b{display:block;font:400 24px/1 Anton,sans-serif;color:var(--accent)}
.count span{display:block;margin-top:5px;font:600 10.5px/1.3 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2{margin:14px 0 8px;font:600 13px/1.3 Oswald,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;gap:9px;align-items:baseline}
h2 em{font-style:normal;opacity:.7;font-weight:500;letter-spacing:.04em;text-transform:none;font-family:Archivo,sans-serif;font-size:12.5px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
li.item{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);
border-radius:9px;padding:13px 46px 13px 56px;display:flex;flex-direction:column;gap:6px}
li.crit{border-left-color:var(--crit)}li.warn{border-left-color:var(--warn)}
li.info{border-left-color:var(--teal)}li.ok{border-left-color:var(--ok)}
.b-star{position:absolute;left:12px;top:11px;width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);
background:var(--surface-2);cursor:pointer;color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center}
li[data-saved="1"] .b-star{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b-done{position:absolute;right:11px;top:12px;width:26px;height:26px;border-radius:6px;border:1.5px solid var(--line);
background:var(--surface-2);cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.b-done:hover{border-color:var(--ok);color:var(--ok)}
.row{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.who{font-weight:650}
.age{font:500 12px/1 Oswald,sans-serif;letter-spacing:.03em;color:var(--muted)}
.pill{font:600 10px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--surface-2);color:var(--cyan)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.what{color:var(--ink-2);font-size:15px}
.what a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
.what a:hover{color:var(--accent);border-bottom-color:var(--accent)}
blockquote{margin:4px 0 0;padding:.3rem 0 .3rem .7rem;border-left:2px solid var(--line);color:var(--ink-2);font-size:14.5px}
.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.links a{font:600 11px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;
padding:6px 9px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.links a.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px 15px;font-size:14px;color:var(--ink-2)}
.err{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit);border-radius:9px;padding:12px 15px}
.sys{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:12px;
font:500 12.5px/1.5 Oswald,sans-serif;letter-spacing:.04em;color:var(--muted)}
.sys .amber{color:var(--warn)}.sys .good{color:var(--ok)}
.gate{max-width:420px;margin:14vh auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}
.gate input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.7rem .8rem;color:var(--ink);font:inherit;font-size:1rem}
.gate button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:.7rem;font:600 15px/1 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.gate h1{font-size:clamp(30px,8vw,44px)}
.addrow{display:flex;gap:.5rem;margin-bottom:.5rem}
.addrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.6rem .75rem;color:var(--ink);font:inherit}
.addrow button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:0 1.1rem;font:600 14px/1 Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
li.mine{padding-left:15px}
.more{border:1px solid var(--line);background:none;color:var(--cyan);border-radius:7px;padding:8px 12px;cursor:pointer;font:600 12px/1 Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
footer{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:13px}
</style></head><body><div id="app"></div>
<script>
var LANES=[["hq","The Program"],["todo","Today"]];
var lane=(location.hash||"#hq").slice(1); if(!LANES.some(function(l){return l[0]===lane}))lane="hq";
function setFav(){}
var KEYSTORE="cc-pass", FLAGS="cc-flags-", MINE="cc-mine-", NIGHTS="cc-nights", HQCFG="cc-hq";
var FEED=null, err=null, busy=false, hidden=0, GLANCE=null;
var HQ=lsGet0(HQCFG,null);           // {url,key} -- rides inside the encrypted todo feed
var SYNC={state:HQ?"":"waiting for feed",ok:null};
function $(id){return document.getElementById(id)}
function safe(u){u=String(u==null?"":u).trim();return /^(https:|sms:|tel:|mailto:)/i.test(u)?u:""}
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lsGet0(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}}
var lsGet=lsGet0;
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}}
function flagLane(){return lane==="hq"?"todo":lane}
function flags(){return lsGet(FLAGS+flagLane(),{})}
// IDENTITY: the server's content-derived stable key `k` (stable_key.py) is the
// canonical id a tick is recorded against -- it is what the store, the phone and
// the 03:00 VA all agree on. fp() below survives ONLY to migrate flags written
// before Oct 30 2026 (and as a fallback for items missing k). The Aug 23 lesson
// (two key changes wiped every dismissal) now lives server-side in stable_key.py.
function fp(it){
  var href="";
  if(it.l&&it.l.length&&it.l[0].length>1)href=String(it.l[0][1]);
  else if(it.url)href=String(it.url);
  href=href.split(/[?#]/)[0].replace(/\/+$/,"").toLowerCase();
  var strip=function(x){return String(x||"").toLowerCase()
    .replace(/\d{4}-\d{2}-\d{2}([t ]\d{2}:\d{2}(:\d{2})?z?)?/g," ")
    .replace(/\b\d{1,2}:\d{2}\s*(am|pm)?\b/g," ")
    .replace(/\b\d+\s*(d|h|m|days?|hours?|weeks?)\s*(ago|old|over|left)?\b/g," ")
    .replace(/\b(today|tomorrow|tonight|yesterday|overnight|new)\b/g," ")
    .replace(/[^a-z0-9]+/g," ").trim()};
  var who=String(it.who||it.headline||it.source||"");
  var subj=strip(who.split(/\s+[-–—:]\s+|\s{2,}/)[0])||strip(who);
  return href ? href+"|"+subj.slice(0,60) : subj.slice(0,80);
}
function keyOf(it){return it.k||fp(it)}
function fmtDate(iso){
  if(!iso)return "";
  var p=String(iso).split("-"); if(p.length!==3)return iso;
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var days=Math.floor((Date.now()-d.getTime())/86400000);
  var lbl=M[+p[1]-1]+" "+(+p[2]);
  if(days>0)lbl+=" ("+days+"d)";
  return lbl;
}
function setFlag(k,n,v,it){var f=flags();var o=f[k]||(f[k]={});
 if(v){o[n]=1; if(n==="done"&&it)o.at=(it.latest||it.since||"");}
 else {delete o[n]; if(n==="done")delete o.at;}
 o.ts=Date.now();                     // tombstones kept for cross-device merge
 lsSet(FLAGS+flagLane(),f);
 if(flagLane()==="todo")queuePush();}
function flagsFor(it){return flags()[keyOf(it)]||{}}
// Cleared means CLEARED. Comes back only when the topic itself moves (newer
// dated event than the one cleared). Reworded summaries never resurface it.
function isDone(it){var f=flagsFor(it);
 if(!f.done)return false;
 if(!f.at)return true;
 var cur=it.latest||it.since||"";
 if(!cur)return true;
 return cur<=f.at;
}
// One-time migration of pre-Oct-30 fp()-keyed flags onto the server key `k`.
function migrate(){
  if(!FEED)return;
  var mk="cc-migrated-k-"+flagLane();
  var f=lsGet(FLAGS+flagLane(),{}),ch=false;
  if(!localStorage.getItem(mk)){
    (FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
      if(!i.k)return;var old=f[fp(i)];
      if(old&&!f[i.k]&&i.k!==fp(i)){f[i.k]=old;delete f[fp(i)];ch=true}
    })});
    try{localStorage.setItem(mk,"1")}catch(x){}
  }
  Object.keys(f).forEach(function(k){if(!f[k].ts){f[k].ts=Date.now();ch=true}});
  var m=lsGet(MINE+"todo",null);
  if(m){var ch2=false;m.forEach(function(it){if(!it.ts){it.ts=Date.now();ch2=true}});
    if(ch2)lsSet(MINE+"todo",m)}
  if(ch)lsSet(FLAGS+flagLane(),f);
}

/* ---------- crypto: mirrors publish_web.py exactly (PBKDF2 600k, AES-256-GCM) ---------- */
function b2a(a){var s="";a.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function a2b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function pbkey(phrase,salt,use){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(phrase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,[use]);
}
async function decrypt(blob,phrase){
  var key=await pbkey(phrase,a2b(blob.salt),"decrypt");
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:a2b(blob.iv)},key,a2b(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encryptJSON(obj,phrase){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  var key=await pbkey(phrase,salt,"encrypt");
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,
    new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,salt:b2a(salt),iv:b2a(iv),ct:b2a(ct)};
}

/* ---------- HQ store sync (Apps Script; key travels only in the POST body) ---------- */
function hqPost(body){
  body.key=HQ.key;
  return fetch(HQ.url,{method:"POST",headers:{"Content-Type":"text/plain"},
    body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function entTs(o){return (o&&o.ts)||0}
function mergeFlags(loc,rem){var o=Object.assign({},loc);
  Object.keys(rem||{}).forEach(function(k){if(entTs(rem[k])>entTs(o[k]))o[k]=rem[k]});return o}
function mergeMine(loc,rem){var m={};
  (rem||[]).concat(loc||[]).forEach(function(it){if(!it||!it.k)return;
    var c=m[it.k];if(!c||entTs(it)>=entTs(c))m[it.k]=it});
  return Object.keys(m).map(function(k){return m[k]})
    .sort(function(a,b){return entTs(a)-entTs(b)});}
function mergeNights(loc,rem){var o=Object.assign({},loc);
  Object.keys(rem||{}).forEach(function(k){if(entTs(rem[k])>entTs(o[k]))o[k]=rem[k]});return o}
async function syncPull(){
  if(!HQ)return;
  try{
    var r=await hqPost({action:"read_blob",kind:"flags"});
    if(r.ok&&r.data){
      // blob is ciphertext under the board passphrase; a rotated phrase makes an
      // old blob unreadable -> treated as absent, next push rewrites it.
      try{
        var rem=await decrypt(JSON.parse(r.data),localStorage.getItem(KEYSTORE));
        lsSet(FLAGS+"todo",mergeFlags(lsGet(FLAGS+"todo",{}),rem.flags));
        lsSet(MINE+"todo",mergeMine(lsGet(MINE+"todo",[]),rem.mine));
        lsSet(NIGHTS,mergeNights(lsGet(NIGHTS,{}),rem.nights));
      }catch(x){}
    }
    SYNC.state="synced";SYNC.ok=true;
    if(lsGet("cc-dirty",0))pushFlags();
    draw();
  }catch(x){SYNC.state="offline -- this device only";SYNC.ok=false;drawSys()}
}
var pushTimer=null;
function queuePush(){lsSet("cc-dirty",1);SYNC.state="saving...";drawSys();
  if(pushTimer)clearTimeout(pushTimer);pushTimer=setTimeout(pushFlags,1800)}
async function pushFlags(){
  if(!HQ){SYNC.state="waiting for feed";drawSys();return}
  try{
    var state={v:1,ts:Date.now(),flags:lsGet(FLAGS+"todo",{}),
      mine:lsGet(MINE+"todo",[]),nights:lsGet(NIGHTS,{})};
    var blob=await encryptJSON(state,localStorage.getItem(KEYSTORE));
    var r=await hqPost({action:"blob",kind:"flags",data:JSON.stringify(blob),
      meta:{n:Object.keys(state.flags).length,mine:state.mine.length}});
    if(r.ok){lsSet("cc-dirty",0);SYNC.state="synced";SYNC.ok=true}
    else{SYNC.state="saved on this device -- will retry";SYNC.ok=false}
  }catch(x){SYNC.state="saved on this device -- will retry";SYNC.ok=false}
  drawSys();
}
async function loadGlance(){
  if(!HQ)return;
  try{var r=await hqPost({action:"glance"});if(r.ok){GLANCE=r.glance;drawSys()}}catch(x){}
}
function fireEvent(type,k,payload){
  if(!HQ)return;
  try{hqPost({action:"event",uuid:crypto.randomUUID(),type:type,k:k,payload:payload})
    .catch(function(){})}catch(x){}
}

/* ---------- the game clock (day boundary 04:00) ---------- */
function eveDate(){var d=new Date();if(d.getHours()<4)d.setDate(d.getDate()-1);return d}
function dk(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function lvlNow(){var h=new Date().getHours();
  if(h>=4&&h<22)return "RX+"; if(h===22)return "RX"; if(h===23)return "SCALED"; return "LATE"}
function streakOf(n){var d=eveDate();if(!n[dk(d)])d.setDate(d.getDate()-1);
  var s=0;while(n[dk(d)]){s++;d.setDate(d.getDate()-1)}return s}
function nightsBack(n){var c=0;Object.keys(n).forEach(function(k){if(n[k].l==="RX+")c++});return c}
var RHYTHM={
 1:["ENGINE ROOM","CircleFit accessory done. Skeletons prepped. Build the week before the week builds you."],
 2:["CLEAR THE DECKS","GPP athletes + WP Athlete out the door. Notifications driven to zero."],
 3:["ZERO INBOX","Notifications cleared completely. Nothing rides into Thursday."],
 4:["FIRST SWING","10-15 CrossFit athletes drafted tonight. Clean Sunday is won right here, not on Sunday."],
 5:["FINISH THE SWING","First-swing stragglers done. Walk into the weekend light."],
 6:["PROTECTED","Saturday is off by default. Untouched = bonus. Go be a husband and a dad."],
 0:["THE TEN","Only the complex ones left if the week did its job. Done by 10, lights out."]};
var S1=new Date(2026,10,9); // Season 1: Mon Nov 9

/* ---------- data load ---------- */
async function load(){
  setFav();
  busy=true; err=null; draw();
  var phrase=localStorage.getItem(KEYSTORE);
  if(!phrase){busy=false;draw();return}
  try{
    var file=(lane==="hq"?"todo":lane)+".json";
    var r=await fetch(file+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("no data file for "+lane+" yet (HTTP "+r.status+")");
    FEED=await decrypt(await r.json(),phrase);
    if(FEED.hq&&FEED.hq.url&&FEED.hq.key){HQ=FEED.hq;lsSet(HQCFG,HQ)}
    migrate();
  }catch(x){
    if(String(x).indexOf("operation-specific")>-1||x.name==="OperationError"){
      localStorage.removeItem(KEYSTORE); err="Wrong passphrase.";
    } else err=String(x.message||x);
  }
  busy=false; draw();
  if(lane==="hq"||flagLane()==="todo"){syncPull();loadGlance()}
}

function item(it){
  var k=keyOf(it),f=flagsFor(it);
  if(isDone(it))return "";
  var h='<li class="item '+e(it.tone||it.c||"info")+'" data-k="'+e(k)+'" data-saved="'+(f.saved?1:0)+'">';
  h+='<button class="b-star" data-a="saved" title="Read later">&#9733;</button>';
  h+='<button class="b-done" data-a="done" title="Clear">&#10003;</button>';
  h+='<div class="row"><span class="who">'+e(it.source||it.who||"")+'</span>';
  var pl=it.pills||(it.pill?[it.pill]:[]);
  pl.forEach(function(p){if(typeof p==="string")return;
    var t=p.tone||p[0],x=p.text||p[1];
    if(x!==undefined)h+='<span class="pill '+e(t)+'">'+e(x)+'</span>'});
  var since=it.since?fmtDate(it.since):"";
  var extra=e(it.when||it.age||"");
  h+='<span class="age">'+(since?'since '+since:"")+'</span></div>';
  if(extra&&extra!==since)h+='<div class="age" style="margin-top:-2px">'+extra+'</div>';
  if(it.headline||it.url){var hd=e(it.headline||it.url);
    if(it.url&&safe(it.url))hd='<a href="'+e(safe(it.url))+'" target="_blank" rel="noopener noreferrer">'+hd+'</a>';
    h+='<div class="what"><strong>'+hd+'</strong></div>';
  }
  if(it.q)h+='<blockquote>'+e(it.q)+'</blockquote>';
  if(it.why||it.w)h+='<div class="what">'+e(it.why||it.w)+'</div>';
  if(it.extra)h+='<div class="note">'+e(it.extra)+'</div>';
  if(it.l&&it.l.length){h+='<div class="links">';
    it.l.forEach(function(a){var u=safe(a[1]);h+=u?'<a class="'+e(a[0])+'" href="'+e(u)+'" target="_blank" rel="noopener noreferrer">'+e(a[2])+'</a>':'<span class="'+e(a[0])+'">'+e(a[2])+'</span>'});
    h+='</div>'}
  return h+'</li>';
}

function mineHTML(){
  var mine=lsGet(MINE+"todo",[]),open=0,h="";
  h+='<h2>My list <em>yours, not swept -- follows you across devices</em></h2>'
   +'<div class="addrow"><input id="ai" placeholder="Add a to-do..."><button id="ab">Add</button></div><ul>';
  mine.forEach(function(m){if(m.done)return;open++;
    h+='<li class="item mine info" data-k="'+e(m.k)+'" data-mine="1"><button class="b-done" data-a="done">&#10003;</button>'
     +'<div class="what">'+e(m.who)+'</div></li>'});
  h+='</ul>';
  return {h:h,open:open};
}

function sysHTML(){
  var rows=[];
  if(GLANCE&&GLANCE.last_heartbeat){
    var m=Math.round((Date.now()-new Date(GLANCE.last_heartbeat).getTime())/60000);
    if(m<30)rows.push('<span class="good">MAC &middot; synced '+(m<2?'just now':m+'m ago')+'</span>');
    else rows.push('<span class="amber">MAC &middot; quiet '+(m<120?m+'m':Math.round(m/60)+'h')+' -- asleep or offline. System state, not yours.</span>');
  }
  if(FEED&&(FEED.stamp||FEED.generated))rows.push('BOARD &middot; '+e(FEED.stamp||FEED.generated));
  if(HQ){var c=SYNC.ok===false?'amber':(SYNC.ok?'good':'');
    rows.push('<span class="'+c+'">TICKS &middot; '+e(SYNC.state||"...")+'</span>');}
  else rows.push('<span class="amber">TICKS &middot; store config arrives with the next board publish</span>');
  return '<div class="sys" id="sys">'+rows.map(function(r){return '<div>'+r+'</div>'}).join("")+'</div>';
}
function drawSys(){var s=$("sys");if(s)s.outerHTML=sysHTML()}

function tabsHTML(){
  var h='<div class="tabs">';
  LANES.forEach(function(l){h+='<button data-lane="'+l[0]+'"'+(l[0]===lane?' aria-current="true"':'')+'>'+l[1]+'</button>'});
  return h+'<button id="refresh">Refresh</button></div>';
}

/* ---------- THE PROGRAM landing ---------- */
function drawHQ(){
  var now=new Date(),ed=eveDate(),day=ed.getDay(),R=RHYTHM[day];
  var nights=lsGet(NIGHTS,{}),tonight=nights[dk(ed)];
  var h='<div class="wrap">';
  h+='<div><div class="kicker">The Program <em>&middot;</em> <span style="color:var(--cyan)">Don\'t be a pussy</span></div>';
  h+='<h1>'+["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][day]+': '+R[0]+'</h1>';
  h+='<div class="sub">'+R[1]+'</div></div>';
  h+=tabsHTML();
  if(busy)h+='<div class="note">Loading&hellip;</div>';
  if(err)h+='<div class="err">'+e(err)+'</div>';

  // TONIGHT -- Lights Out
  var hr=now.getHours();
  h+='<div class="card gold"><div class="clabel">Lights Out';
  var cd="";
  if(hr>=4&&hr<22){var mins=(21-hr)*60+(60-now.getMinutes());
    cd='Rx+ closes at 10:00 PM &middot; '+Math.floor(mins/60)+'h '+(mins%60)+'m left';}
  else if(hr===22)cd='Rx+ gone. Rx closes at 11:00 PM';
  else if(hr===23)cd='Scaled closes at midnight';
  else cd='Past midnight -- log it anyway. Finishing beats skipping.';
  h+='<span class="r">'+cd+'</span></div>';
  if(tonight){
    h+='<div class="won"><span class="lvl">'+e(tonight.l)+'</span>'
     +'<span class="d">called at '+e(tonight.t||"")+' &middot; streak '+streakOf(nights)
     +' &middot; '+nightsBack(nights)+' evenings bought back</span></div>'
     +'<div class="sub" style="margin-top:8px">Done by 10 is a real evening. That\'s the whole game.</div>';
  }else{
    var lvl=lvlNow();
    h+='<div class="ladder">'
     +'<div class="rung'+(lvl==="RX+"?" live":" gone")+'"><b>RX+</b><span>by 10 PM</span></div>'
     +'<div class="rung'+(lvl==="RX"?" live":(lvl==="RX+"?"":" gone"))+'"><b>RX</b><span>by 11 PM</span></div>'
     +'<div class="rung'+(lvl==="SCALED"?" live":(lvl==="LATE"?" gone":""))+'"><b>SCALED</b><span>by 12 AM</span></div>'
     +'</div>';
    var st=streakOf(nights);
    h+='<button class="cta" id="callit">Call it &mdash; done for the night</button>';
    h+='<div class="sub" style="margin-top:8px">'+(st?('Streak '+st+' night'+(st>1?'s':'')+' &middot; '):'')
     +nightsBack(nights)+' evenings bought back. Done = work closed, tomorrow\'s list posted.</div>';
  }
  h+='</div>';

  // Week strip
  var labels=["M","T","W","T","F","S","S"],map=[1,2,3,4,5,6,0];
  h+='<div class="card"><div class="clabel">The week</div><div class="weekstrip">';
  map.forEach(function(d,i){
    h+='<div class="'+(d===day?"today":"")+(d===6?" off":"")+'">'+labels[i]+'<br>'
     +["TEN","ENGINE","GPP","ZERO","SWING","FINISH","OFF"][ (d===0)?0:d ]+'</div>'});
  h+='</div>';
  var pre=now<S1;
  h+='<div class="sub" style="margin-top:10px">'+(pre
    ?('BLOCK 0 &middot; baseline runs through Sat Nov 8. Season 1 opens Mon Nov 9 -- every night and every Sunday counts from there.')
    :('SEASON 1 &middot; week '+(Math.floor((now-S1)/604800000)+1)+' of 6.'))+'</div></div>';

  if(FEED){
    // NEEDS YOU NOW -- first section of the VA board (already ranked by cost of not acting)
    var s0=(FEED.sections||[])[0]||{items:[]};
    var items=(s0.items||[]).filter(function(i){return !isDone(i)});
    var CAP=15,shown=items.slice(0,CAP);
    h+='<h2>Needs you now <em>'+items.length+' live &middot; ranked by cost of not acting</em></h2><ul>';
    shown.forEach(function(i){h+=item(i)});
    h+='</ul>';
    if(items.length>CAP)h+='<div style="margin-top:8px"><button class="more" data-lane="todo">+'+(items.length-CAP)+' more on the full board &rarr;</button></div>';
    var mh=mineHTML();h+=mh.h;
  }
  h+=sysHTML();
  h+='<footer>Ticks sync through your own store. Cleared items stay cleared until the message itself changes.</footer></div>';
  $("app").innerHTML=h;
  var ci=$("callit");
  if(ci)ci.onclick=function(){
    var lvl=lvlNow(),d=eveDate(),key=dk(d);
    var t=now2();
    var n=lsGet(NIGHTS,{});n[key]={l:lvl,t:t,ts:Date.now()};lsSet(NIGHTS,n);
    fireEvent("lights_out",key,{level:lvl,at:t});
    queuePush();draw();
  };
}
function now2(){var d=new Date(),h=d.getHours(),m=("0"+d.getMinutes()).slice(-2),
  ap=h>=12?"PM":"AM";h=h%12;if(!h)h=12;return h+":"+m+" "+ap}

function draw(){
  var phrase=localStorage.getItem(KEYSTORE);
  if(!phrase){
    $("app").innerHTML='<div class="gate"><div class="kicker">The Program</div>'
      +'<h1>Unlock</h1><div class="note">One time on this device. The data on this page is '
      +'encrypted; the passphrase never leaves your browser.</div>'
      +(err?'<div class="err">'+e(err)+'</div>':'')
      +'<input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password">'
      +'<button id="go">Unlock</button></div>';
    var go=function(){var v=$("pw").value.trim();if(!v)return;
      localStorage.setItem(KEYSTORE,v);load()};
    $("go").onclick=go;
    $("pw").onkeydown=function(ev){if(ev.key==="Enter")go()};
    $("pw").focus();
    return;
  }
  if(lane==="hq"){drawHQ();return}
  var h='<div class="wrap"><div><div class="kicker">The Program</div>'
   +'<h1>'+e((LANES.filter(function(l){return l[0]===lane})[0]||["","" ])[1])+'</h1></div>'
   +tabsHTML();
  if(busy)h+='<div class="note">Loading&hellip;</div>';
  if(err)h+='<div class="err">'+e(err)+'</div>';
  if(FEED){
    h+='<div class="stamp">'+e(FEED.generated||"")+(FEED.stamp?" &middot; "+e(FEED.stamp):"")+'</div>';
    if(FEED.counts&&FEED.counts.length){h+='<div class="counts">';
      FEED.counts.forEach(function(c){h+='<div class="count"><b>'+e(c.n)+'</b><span>'+e(c.label)+'</span></div>'});
      h+='</div>'}
    var saved=[];hidden=0;(FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
      var f=flagsFor(i);
      if(isDone(i)){hidden++;return}
      if(f.saved)saved.push(i)})});
    if(saved.length){h+='<h2>Read later <em>'+saved.length+'</em></h2><ul>';
      saved.forEach(function(i){h+=item(i)});h+='</ul>'}
    (FEED.sections||[]).forEach(function(s){
      var body="";(s.items||[]).forEach(function(i){
        var f=flagsFor(i);if(f.saved&&!isDone(i))return;body+=item(i)});
      h+='<h2>'+e(s.title||s.h||"")+(s.count_label?' <em>'+e(s.count_label)+'</em>':'')
        +(s.em?' <em>'+e(s.em)+'</em>':'')+'</h2>';
      if(s.note)h+='<div class="note">'+e(s.note)+'</div>';
      h+='<ul>'+body+'</ul>'});
    if(FEED.failures&&FEED.failures.length){h+='<h2>Sources that failed <em>'+FEED.failures.length+'</em></h2><ul>';
      FEED.failures.forEach(function(f){h+='<li class="item warn"><div class="what">'+e(f)+'</div></li>'});h+='</ul>'}
  }
  if(FEED&&hidden)h+='<div class="note">'+hidden+' cleared and staying gone. '
    +'<button id="unhide" style="border:1px solid var(--line);background:none;color:var(--accent);'
    +'border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:13px">Show them</button></div>';
  h+='<footer>Updates on its own. Cleared items stay cleared until the message itself changes.</footer></div>';
  $("app").innerHTML=h;
}

document.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.id==="refresh"){load();return}
  if(t.id==="unhide"){var f=flags();Object.keys(f).forEach(function(k){
    delete f[k].done;delete f[k].at;delete f[k].q;f[k].ts=Date.now()});
    lsSet(FLAGS+flagLane(),f);if(flagLane()==="todo")queuePush();draw();return}
  if(t.id==="ab"){var v=$("ai").value.trim();if(!v)return;
    var m=lsGet(MINE+"todo",[]);
    m.push({k:"mine-"+Date.now(),who:v,ts:Date.now()});lsSet(MINE+"todo",m);
    queuePush();$("ai").value="";draw();return}
  if(t.dataset&&t.dataset.lane){lane=t.dataset.lane;location.hash="#"+lane;FEED=null;load();return}
  var li=t.closest&&t.closest("li.item");
  if(li&&t.dataset&&t.dataset.a){
    var k=li.getAttribute("data-k");
    if(li.getAttribute("data-mine")){
      var mm=lsGet(MINE+"todo",[]);
      mm.forEach(function(m){if(m.k===k){m.done=1;m.ts=Date.now()}});
      lsSet(MINE+"todo",mm);queuePush();draw();return}
    var src=null;
    (FEED&&FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
      if(keyOf(i)===k)src=i})});
    if(!src)return;
    var cur=flagsFor(src);
    setFlag(k,t.dataset.a,!cur[t.dataset.a],src);draw();return}
});
window.addEventListener("hashchange",function(){
  var l=location.hash.slice(1);
  if(LANES.some(function(x){return x[0]===l})&&l!==lane){lane=l;FEED=null;load()}});
// keep the Lights Out countdown honest without stomping on typing
setInterval(function(){
  if(lane!=="hq"||!FEED)return;
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))return;
  draw();
},60000);
load();
</script></body></html>
