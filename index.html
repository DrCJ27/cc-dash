<script>
var LANES=[["hq","The Program"],["todo","Full board"],["ideas","Ideas"]];
var TABS=[["hq","The Program"],["ideas","Ideas"]];
var lane=(location.hash||"#hq").slice(1); if(!LANES.some(function(l){return l[0]===lane})&&lane!=="panel")lane="hq";
function setFav(){}
var KEYSTORE="cc-pass", FLAGS="cc-flags-", MINE="cc-mine-", IDEAS="cc-ideas", NIGHTS="cc-nights", HQCFG="cc-hq";
var FEED=null, err=null, busy=false, hidden=0, GLANCE=null;
var OPEN={}, PEND=0, HQ_ALL=0, FOLDS={};   // open folds/cards, redraw deferred while typing, "+N more" expanded
function typing(){var a=document.activeElement;return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))}
function softDraw(){if(typing()){PEND=1;drawSys();return}draw()}
function snapDrafts(){var o={_ie:typeof IEDIT==="undefined"?null:IEDIT,_le:typeof LEDIT==="undefined"?null:LEDIT};["inew","ifind","iedit","dlog","dmin"].forEach(function(id){var x=document.getElementById(id);if(x)o[id]=x.value});return o}
function restoreDrafts(o){Object.keys(o).forEach(function(id){if(id==="_ie"||id==="_le")return;var x=document.getElementById(id);if(!x)return;if(id==="dlog"){if(o[id]&&o._le===LEDIT)x.value=o[id];return}if(id==="iedit"){if(o._ie===IEDIT)x.value=o[id];return}if(!x.value)x.value=o[id]})}
var HQ=lsGet0(HQCFG,null);           // {url,key} -- rides inside the encrypted todo feed
var SYNC={state:HQ?"":"waiting for feed",ok:null};
function $(id){return document.getElementById(id)}
function safe(u){u=String(u==null?"":u).trim();return /^(https:|sms:|tel:|mailto:)/i.test(u)?u:""}
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function lsGet0(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(x){return d}}
var lsGet=lsGet0;
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}}
function flagLane(){return lane==="hq"||lane==="ideas"||lane==="panel"?"todo":lane}
function flags(){return lsGet(FLAGS+flagLane(),{})}
// IDENTITY: the server's content-derived stable key `k` (stable_key.py) is the
// canonical id a tick is recorded against -- it is what the store, the phone and
// the 03:00 VA all agree on. fp() below survives ONLY to migrate flags written
// before Oct 30 2026 (and as a fallback for items missing k). The Aug 23 lesson
// (two key changes wiped every dismissal) now lives server-side in stable_key.py.
function fp(it){
  var href="";
  if(it.l&&it.l.length&&it.l[0].length>1)href=String(it.l[0][1]);
  else if(it.url)href=String(it.url);
  href=href.split(/[?#]/)[0].replace(/\/+$/,"").toLowerCase();
  var strip=function(x){return String(x||"").toLowerCase()
    .replace(/\d{4}-\d{2}-\d{2}([t ]\d{2}:\d{2}(:\d{2})?z?)?/g," ")
    .replace(/\b\d{1,2}:\d{2}\s*(am|pm)?\b/g," ")
    .replace(/\b\d+\s*(d|h|m|days?|hours?|weeks?)\s*(ago|old|over|left)?\b/g," ")
    .replace(/\b(today|tomorrow|tonight|yesterday|overnight|new)\b/g," ")
    .replace(/[^a-z0-9]+/g," ").trim()};
  var who=String(it.who||it.headline||it.source||"");
  var subj=strip(who.split(/\s+[-–—:]\s+|\s{2,}/)[0])||strip(who);
  return href ? href+"|"+subj.slice(0,60) : subj.slice(0,80);
}
function keyOf(it){return it.k||fp(it)}
function fmtDate(iso){
  if(!iso)return "";
  var p=String(iso).split("-"); if(p.length!==3)return iso;
  var M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var days=Math.floor((Date.now()-d.getTime())/86400000);
  var lbl=M[+p[1]-1]+" "+(+p[2]);
  if(days>0)lbl+=" ("+days+"d)";
  return lbl;
}
function setFlag(k,n,v,it){var f=flags();var o=f[k]||(f[k]={});
 if(v){o[n]=1; if(n==="done"&&it)o.at=(it.horizon||it.latest||it.since||"");}
 else {delete o[n]; if(n==="done")delete o.at;}
 o.ts=Date.now();                     // tombstones kept for cross-device merge
 lsSet(FLAGS+flagLane(),f);
 if(flagLane()==="todo")queuePush();}
function flagsFor(it){return flags()[keyOf(it)]||{}}
// Cleared means CLEARED. Comes back only when the topic itself moves (newer
// dated event than the one cleared). Reworded summaries never resurface it.
function isDone(it){var f=flagsFor(it);
 if(!f.done)return false;
 if(!f.at)return true;
 var cur=it.latest||it.since||"";
 if(!cur)return true;

}
// One-time migration of pre-Oct-30 fp()-keyed flags onto the server key `k`.
function pruneFlags(){
  if(!FEED)return;var f=lsGet(FLAGS+"todo",{}),live={},cut=Date.now()-60*86400000,ch=false;
  (FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){live[keyOf(i)]=1;(i.aka||[]).forEach(function(a){live[a]=1})})});
  Object.keys(f).forEach(function(k){if(!live[k]&&(f[k].ts||0)<cut){delete f[k];ch=true}});
  if(ch)lsSet(FLAGS+"todo",f);
}
function carryTicks(){
  if(!FEED)return;var f=lsGet(FLAGS+"todo",{}),ch=false;
  (FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
    if(!i.aka||f[i.k])return;
    i.aka.forEach(function(a){if(f[a]&&f[a].done&&!f[i.k]){f[i.k]={done:1,ts:f[a].ts||1};ch=true}})})});
  if(ch){lsSet(FLAGS+"todo",f);lsSet("cc-dirty",1);PGEN++}
}
function migrate(){
  if(!FEED)return;
  var mk="cc-migrated-k-"+flagLane();
  var f=lsGet(FLAGS+flagLane(),{}),ch=false;

/* ---------- crypto: mirrors publish_web.py exactly (PBKDF2 600k, AES-256-GCM) ---------- */
function b2a(a){var s="";a.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s)}
function a2b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function pbkey(phrase,salt,use){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(phrase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,[use]);
}
async function decrypt(blob,phrase){
  var key=await pbkey(phrase,a2b(blob.salt),"decrypt");
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:a2b(blob.iv)},key,a2b(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encryptJSON(obj,phrase){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  var key=await pbkey(phrase,salt,"encrypt");
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,
    new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,salt:b2a(salt),iv:b2a(iv),ct:b2a(ct)};
}

/* ---------- HQ store sync (Apps Script; key travels only in the POST body) ---------- */
function hqPost(body){
  body.key=HQ.key;
  var ac=new AbortController(),to=setTimeout(function(){ac.abort()},30000);
  return fetch(HQ.url,{method:"POST",headers:{"Content-Type":"text/plain"},signal:ac.signal,
    body:JSON.stringify(body)}).then(function(r){return r.json()}).finally(function(){clearTimeout(to)});
}
function entTs(o){return (o&&o.ts)||0}
function mergeFlags(loc,rem){var o=Object.assign({},loc);
  Object.keys(rem||{}).forEach(function(k){if(entTs(rem[k])>entTs(o[k]))o[k]=rem[k]});return o}
function mergeMine(loc,rem){var m={};
  (rem||[]).concat(loc||[]).forEach(function(it){if(!it||!it.k)return;
    var c=m[it.k];if(!c||entTs(it)>=entTs(c))m[it.k]=it});
  return Object.keys(m).map(function(k){return m[k]})
    .sort(function(a,b){return entTs(a)-entTs(b)});}
function mergeNights(loc,rem){var o=Object.assign({},loc);
  Object.keys(rem||{}).forEach(function(k){if(entTs(rem[k])>entTs(o[k]))o[k]=rem[k]});return o}
var SYNCING=null, PUSHING=null, REPUSH=0;
async function pullMerge(){
  // Merge the store copy INTO local before anything else happens. Returns the store's
  // version stamp so the following write can be refused if someone wrote in between.
  var r=await hqPost({action:"read_blob",kind:"flags"});
  if(r.ok&&r.data){
    try{
      var rem=await decrypt(JSON.parse(r.data),localStorage.getItem(KEYSTORE));
      lsSet(FLAGS+"todo",mergeFlags(lsGet(FLAGS+"todo",{}),rem.flags));
      lsSet(MINE+"todo",mergeMine(lsGet(MINE+"todo",[]),rem.mine));
      lsSet(IDEAS,mergeMine(lsGet(IDEAS,[]),rem.ideas));
      lsSet(NIGHTS,mergeNights(lsGet(NIGHTS,{}),rem.nights));
    }catch(x){throw new Error("unreadable")}   // never overwrite what we cannot read (passphrase rotated?)
    return r.updated||"";
  }
  if(r.ok===false&&r.error==="not_found")return "";
  throw new Error("read failed");
}
function syncPull(){
  if(!HQ)return Promise.resolve();
  if(SYNCING)return SYNCING;
  SYNCING=(async function(){
    try{
      var upd=await pullMerge();carryTicks();
      SYNC.state="synced";SYNC.ok=true;
      if(lsGet("cc-dirty",0))await pushFlags(upd);
      softDraw();
    }catch(x){SYNC.state=x.message==="unreadable"?"store copy unreadable. Saved here, not syncing. Tell Claude.":"offline, this device only";SYNC.ok=false;drawSys()}
    finally{SYNCING=null}
  })();
  return SYNCING;
}
var pushTimer=null,PGEN=0,RETRY=null;
function queuePush(now){PGEN++;lsSet("cc-dirty",1);SYNC.state="saving...";drawSys();
  if(pushTimer)clearTimeout(pushTimer);
  if(now)pushFlags();else pushTimer=setTimeout(pushFlags,1800)}
async function pushFlags(knownUpd){
  if(!HQ){SYNC.state="waiting for feed";drawSys();return}
  if(!localStorage.getItem(KEYSTORE))return;   // never encrypt under a missing passphrase
  if(PUSHING){REPUSH=1;return PUSHING}
  PUSHING=(async function(){
    try{
      // Never write blind: a stale device used to overwrite every other device's
      // ideas and ticks server-side (review, Nov 4 2026). Pull + merge, then write
      // against the stamp we read; the store refuses if it moved, and we retry once.
      var upd=(knownUpd!==undefined)?knownUpd:await pullMerge();
      if(!lsGet("cc-dirty",0)){SYNC.state="synced";SYNC.ok=true;drawSys();return}
      for(var attempt=0;attempt<2;attempt++){
        pruneFlags();
        var gen=PGEN;
        var state={v:1,ts:Date.now(),flags:lsGet(FLAGS+"todo",{}),
          mine:lsGet(MINE+"todo",[]),ideas:lsGet(IDEAS,[]),nights:lsGet(NIGHTS,{})};
        var blob=await encryptJSON(state,localStorage.getItem(KEYSTORE));
        if(JSON.stringify(blob).length>45000){SYNC.state="too big to sync. Ideas are safe on this device. Tell Claude.";SYNC.ok=false;break}
        var r=await hqPost({action:"blob",kind:"flags",data:JSON.stringify(blob),if_updated:upd,
          meta:{n:Object.keys(state.flags).length,mine:state.mine.length,ideas:state.ideas.length}});
        if(r.ok){if(gen===PGEN){lsSet("cc-dirty",0);SYNC.state="synced"}else REPUSH=1;SYNC.ok=true;break}
        if(r.error==="conflict"&&attempt===0){upd=await pullMerge();continue}
        SYNC.state="saved here, will sync";SYNC.ok=false;break;
      }
    }catch(x){SYNC.state=x.message==="unreadable"?"store copy unreadable. Saved here, not syncing. Tell Claude.":"saved here, will sync";SYNC.ok=false}
    finally{PUSHING=null}
    drawSys();
    if(REPUSH){REPUSH=0;pushFlags()}
    else if(lsGet("cc-dirty",0)&&!RETRY){RETRY=setTimeout(function(){RETRY=null;if(lsGet("cc-dirty",0))pushFlags()},60000)}
  })();
  return PUSHING;
}

  if(txt.length<=LIM+40)return '<div class="what">'+e(txt)+'</div>';
  var cut=txt.slice(0,LIM),m=cut.lastIndexOf('. ');
  if(m>80)cut=txt.slice(0,m+1);else{var sp=cut.lastIndexOf(' ');if(sp>80)cut=cut.slice(0,sp);}

  var fi=$("ifind");if(fi){fi.oninput=function(){IFILTER=fi.value;$("igrid").innerHTML=ideasGridHTML()}}
  var ed=$("iedit");if(ed){ed.focus();ed.selectionStart=ed.value.length;
    ed.onkeydown=function(ev){if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();saveIdeaEdit()}if(ev.key==="Escape"){IEDIT=null;redrawIdeas()}}}
}
function redrawIdeas(){var dr=snapDrafts();var g=$("igrid");if(g)g.innerHTML=ideasGridHTML();else draw();restoreDrafts(dr);
  var ed=$("iedit");if(ed){ed.focus();ed.selectionStart=ed.value.length;
    ed.onkeydown=function(ev){if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey)){ev.preventDefault();saveIdeaEdit()}if(ev.key==="Escape"){IEDIT=null;redrawIdeas()}}}}
function addIdea(){
  var ta=$("inew"),v=ta?ta.value.trim():"";if(!v)return;
  var all=lsGet(IDEAS,[]);all.push({k:"idea-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:v,ts:Date.now()});
  lsSet(IDEAS,all);queuePush(1);ta.value="";try{localStorage.removeItem("cc-idea-draft")}catch(x){}IFILTER="";var fi=$("ifind");if(fi)fi.value="";redrawIdeas();
}
function saveIdeaEdit(){
  var ed=$("iedit");if(!ed||!IEDIT)return;var v=ed.value.trim();
  if(!v){IEDIT=null;redrawIdeas();return}
  var all=lsGet(IDEAS,[]),ch=false;all.forEach(function(i){if(i.k===IEDIT&&i.t!==v){i.t=v;i.ts=Date.now();ch=true}});
  lsSet(IDEAS,all);IEDIT=null;if(ch)queuePush();redrawIdeas();
}
function ideaAct(k,a){
  var all=lsGet(IDEAS,[]),hit=null;all.forEach(function(i){if(i.k===k)hit=i});if(!hit)return;
  if(a==="edit"){IEDIT=k;redrawIdeas();return}
  if(a==="icancel"){IEDIT=null;redrawIdeas();return}
  if(a==="isave"){saveIdeaEdit();return}
  if(a==="star")hit.star=hit.star?0:1;
  if(a==="arch")hit.arch=1;
  if(a==="restore")hit.arch=0;
  if(a==="todo"){var m=lsGet(MINE+"todo",[]);
    m.push({k:"mine-"+Date.now(),who:hit.t.split("\n")[0].slice(0,160),ts:Date.now(),from:hit.k});lsSet(MINE+"todo",m);hit.todo=1}
  hit.ts=Date.now();lsSet(IDEAS,all);queuePush();redrawIdeas();
}

/* ---------- MENU BAR PANEL (hq/menubar, Nov 4 2026). "Full HQ, Ideas on top." Read-only hooks:
   no secret crosses to the native side, only counts and a clock. ---------- */
var QUICK=false,FEED_AT=0,LOAD_AT=0,DRAFT="cc-idea-draft";
function captureHTML(){
  var kb=window.matchMedia&&window.matchMedia("(hover:hover)").matches,n=openIdeas();
  return '<div class="card gold"><div class="clabel">Get it out of your head'+(kb?'<span class="r">Enter = idea &middot; &#8984; Enter = to-do</span>':'')+'</div>'
   +'<textarea id="inew" class="inew" placeholder="What is it..."></textarea>'
   +'<div class="iact"><button class="ib go" id="iadd">Idea</button><button class="ib go" id="itodo">To-do</button>'
   +'<button class="ib" data-lane="ideas">'+n+(n===1?' idea':' ideas')+' &rarr;</button></div></div>';
}
function wireCapture(foc){
  var ta=$("inew");if(!ta)return;
  var kb=window.matchMedia&&window.matchMedia("(hover:hover)").matches;
  if(!ta.value)ta.value=lsGet(DRAFT,"");
  ta.oninput=function(){lsSet(DRAFT,ta.value)};
  ta.onkeydown=function(ev){
    if(ev.key!=="Enter"||ev.shiftKey||ev.isComposing)return;
    if(ev.metaKey||ev.ctrlKey){ev.preventDefault();addTodo();return}
    if(!kb)return;                  // phone Return is a new line; the buttons save
    ev.preventDefault();if(ta.value.trim())panelSave();};
  if(foc){ta.focus();ta.selectionStart=ta.value.length}
}
function addTodo(){
  var ta=$("inew"),v=ta?ta.value.trim():"";if(!v)return;
  var q=QUICK,m=lsGet(MINE+"todo",[]);
  m.push({k:"mine-"+Date.now(),who:v,ts:Date.now()});lsSet(MINE+"todo",m);
  ta.value="";try{localStorage.removeItem(DRAFT)}catch(x){}
  queuePush(1);draw();if(q)nativeClose();
}
function nativeClose(){try{window.webkit.messageHandlers.hq.postMessage("close")}catch(x){}}
function openIdeas(){return lsGet(IDEAS,[]).filter(function(i){return i&&!i.arch}).length}
function drawPanel(){
  var ae=document.activeElement,foc=(ae&&ae.id==="inew")||(QUICK&&(!ae||ae===document.body));
  var h='<div class="wrap">'+tabsHTML();
  if(busy&&!FEED)h+='<div class="note">Loading&hellip;</div>';
  if(err)h+='<div class="err">'+e(err)+'</div>';
  h+=captureHTML()+mineHTML().h;
  if(FEED)h+=listsHTML();
  h+=lightsOutHTML()+sysHTML()+'</div>';
  var dr=snapDrafts();$("app").innerHTML=h;restoreDrafts(dr);
  wireCallIt();
  wireCapture(foc);
}
function panelSave(){var q=QUICK;try{localStorage.removeItem(DRAFT)}catch(x){}addIdea();if(q)nativeClose()}
document.addEventListener("keydown",function(ev){if(ev.key==="Escape")nativeClose()});   // no-op in a browser
window.hqOpen=function(quick){
  QUICK=!!quick;
  if(lane!=="panel"){lane="panel";location.hash="#panel";draw()}
  comeBack();
  if(quick){var t=$("inew")||$("pw");if(t){t.focus();if(t.selectionStart!==undefined)t.selectionStart=t.value.length}}
};
window.hqFlush=function(){      // panel closed: stop counting as "typing" so refresh and the count stay live
  QUICK=false;
  var a=document.activeElement;if(a&&a.blur)a.blur();
  if(PEND){PEND=0;draw()}
  if(localStorage.getItem(KEYSTORE)&&lsGet("cc-dirty",0))queuePush(1);
};
window.hqTick=function(shown){      // native calls every 60s: keep a long-running page honest
  if(busy&&Date.now()-LOAD_AT>120000)busy=false;   // a load that never returned must not block refresh forever
  if(!localStorage.getItem(KEYSTORE)||busy)return;
  if(lsGet("cc-dirty",0)&&!PUSHING)pushFlags();
  if(shown||typing())return;
  if(Date.now()-LAST_TICK>300000){LAST_TICK=Date.now();loadGlance();logSync();workPull()}   // decrypting is not free: not every minute
  if(!FEED||Date.now()-FEED_AT>900000)load();
};
window.hqGlance=function(){
  var unlocked=!!localStorage.getItem(KEYSTORE),top=unlocked?topNow():null,d=new Date(),hh=d.getHours(),
      end=(hh>=4&&hh<22)?22:(hh===22?23:(hh===23?24:0)),ta=$("inew"),t=lsGet(NIGHTS,{})[dk(eveDate())];
  return JSON.stringify({unlocked:unlocked,feed:!!FEED,needs:top?top.length:-1,lvl:lvlNow(),
    mins_left:end?(end-hh)*60-d.getMinutes():0,called:t?t.l:"",draft:!!((ta&&ta.value.trim())||($("dlog")&&$("dlog").value.trim())),
    dirty:lsGet("cc-dirty",0)?1:0,busy:!!busy,err:err?String(err).slice(0,80):""});
};

function draw(){
  var phrase=localStorage.getItem(KEYSTORE);
  if(!phrase){
    $("app").innerHTML='<div class="gate"><div class="kicker">The Program</div>'
      +'<h1>Unlock</h1><div class="note">One time on this device. The data on this page is '
      +'encrypted; the passphrase never leaves this device.</div>'
      +(err?'<div class="err">'+e(err)+'</div>':'')
      +'<input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password">'
      +'<button id="go">Unlock</button></div>';
    var go=function(){var v=$("pw").value.trim();if(!v)return;
      localStorage.setItem(KEYSTORE,v);load()};
    $("go").onclick=go;
    $("pw").onkeydown=function(ev){if(ev.key==="Enter")go()};
    $("pw").focus();
    return;
  }
  if(lane==="hq"){drawHQ();return}
  if(lane==="ideas"){drawIdeas();return}
  if(lane==="panel"){drawPanel();return}
  var h='<div class="wrap"><div><div class="kicker">The Program</div>'
   +'<h1>'+e((LANES.filter(function(l){return l[0]===lane})[0]||["","" ])[1])+'</h1></div>'
   +tabsHTML();
  if(busy)h+='<div class="note">Loading&hellip;</div>';
  if(err)h+='<div class="err">'+e(err)+'</div>';
  if(FEED){
    h+='<div class="stamp">'+e(FEED.generated||"")+(FEED.stamp?" &middot; "+e(FEED.stamp):"")+'</div>';
    if(FEED.counts&&FEED.counts.length){h+='<div class="counts">';
      FEED.counts.forEach(function(c){h+='<div class="count"><b>'+e(c.n)+'</b><span>'+e(c.label)+'</span></div>'});
      h+='</div>'}
    var saved=[];hidden=0;(FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
      var f=flagsFor(i);
      if(isDone(i)){hidden++;return}
      if(f.saved)saved.push(i)})});
    if(saved.length){h+='<h2>Read later <em>'+saved.length+'</em></h2><ul>';
      saved.forEach(function(i){h+=item(i)});h+='</ul>'}
    (FEED.sections||[]).forEach(function(s){
      var body="";(s.items||[]).forEach(function(i){
        var f=flagsFor(i);if(f.saved&&!isDone(i))return;body+=item(i)});
      h+='<h2>'+e(s.title||s.h||"")+(s.count_label?' <em>'+e(s.count_label)+'</em>':'')
        +(s.em?' <em>'+e(s.em)+'</em>':'')+'</h2>';
      if(s.note)h+='<div class="note">'+e(s.note)+'</div>';
      h+='<ul>'+body+'</ul>'});
    if(FEED.failures&&FEED.failures.length){h+='<h2>Sources that failed <em>'+FEED.failures.length+'</em></h2><ul>';
      FEED.failures.forEach(function(f){h+='<li class="item warn"><div class="what">'+e(f)+'</div></li>'});h+='</ul>'}
  }
  if(FEED&&hidden)h+='<div class="note">'+hidden+' cleared and staying gone. '
    +'<button id="unhide" style="border:1px solid var(--line);background:none;color:var(--accent);'
    +'border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit;font-size:13px">Show them</button></div>';
  h+='<footer>Updates on its own. Cleared items stay cleared until the message itself changes.</footer></div>';
  $("app").innerHTML=h;
}

document.addEventListener("click",function(ev){
  var mt=ev.target;
  var tg=mt&&mt.closest?mt.closest("h2.tog"):null;
  if(tg){var ul=tg.nextElementSibling;if(ul){ul.hidden=!ul.hidden;tg.classList.toggle("open",!ul.hidden);
    var fk="f:"+(tg.dataset.fold||"");if(ul.hidden)delete OPEN[fk];else OPEN[fk]=1}return}
  if(mt&&mt.dataset&&mt.dataset.a==="more"){var w=mt.parentNode;w.classList.toggle("open");
    var mk="m:"+(w.dataset.mk||"");if(w.classList.contains("open"))OPEN[mk]=1;else delete OPEN[mk];
    mt.textContent=w.classList.contains("open")?"less":"more";ev.stopPropagation();return}
  if(mt&&mt.dataset&&mt.dataset.a==="expand"){HQ_ALL=1;draw();return}
  if(DELASK&&!(mt&&mt.dataset&&mt.dataset.ld)){DELASK=null;if($("dlog"))draw()}
  var brk=mt&&mt.closest?mt.closest("[data-brk]"):null;
  if(brk){var bk="w:"+(DAYSEL||dk(eveDate()))+brk.dataset.brk;if(OPEN[bk])delete OPEN[bk];else OPEN[bk]=1;draw();return}
  var dayb=mt&&mt.closest?mt.closest("[data-day]"):null;
  if(dayb){if(dayb.dataset.day===(DAYSEL||DAYSET))return;DAYSEL=dayb.dataset.day;LEDIT=null;var dl=$("dlog");if(dl)dl.value="";var dm=$("dmin");if(dm)dm.value="";draw();return}
  if(mt&&mt.dataset&&mt.dataset.week!==undefined){var wk=+mt.dataset.week;WEEKOFF=wk===0?0:WEEKOFF+wk;DAYSEL=null;LEDIT=null;var dw=$("dlog");if(dw)dw.value="";var dx=$("dmin");if(dx)dx.value="";draw();return}
  if(mt&&mt.dataset&&mt.dataset.chip){var cl=$("dlog");if(cl){cl.value=mt.dataset.chip+(cl.value?": "+cl.value:". ");cl.focus();cl.selectionStart=cl.value.length}return}
  if(mt&&mt.id==="dsave"){logSave();return}
  if(mt&&mt.id==="dcancel"){LEDIT=null;var dc=$("dlog");if(dc)dc.value="";var dn=$("dmin");if(dn)dn.value="";draw();return}
  if(mt&&mt.dataset&&mt.dataset.le){LEDIT=mt.dataset.le;var de=$("dlog");if(de)de.value="";var dd=$("dmin");if(dd)dd.value="";draw();return}
  if(mt&&mt.dataset&&mt.dataset.ld){if(DELASK!==mt.dataset.ld){DELASK=mt.dataset.ld;draw();return}
    var LL=logState(),ld=LL.entries[mt.dataset.ld];DELASK=null;if(LEDIT===mt.dataset.ld){LEDIT=null;var dq=$("dlog");if(dq)dq.value=""}if(ld){ld.deleted=1;ld.ts=Date.now();LGEN++;lsSet(LOG,LL);lsSet("cc-log-dirty",1);draw();logSync()}return}
  var t=ev.target;
  if(t.id==="refresh"){load();return}
  if(t.id==="iadd"){if(lane==="panel"||lane==="hq")panelSave();else addIdea();return}
  if(t.id==="itodo"){addTodo();return}
  var tb=t.closest&&t.closest("[data-tag]");
  if(tb){var nf=tb.dataset.tag?"#"+tb.dataset.tag:"";IFILTER=(nf&&nf===IFILTER)?"":nf;var fi=$("ifind");if(fi)fi.value=IFILTER;redrawIdeas();return}
  var il=t.closest&&t.closest("li.idea");
  if(il&&t.dataset&&t.dataset.a){ideaAct(il.getAttribute("data-k"),t.dataset.a);return}
  if(t.id==="unhide"){var f=flags();Object.keys(f).forEach(function(k){
    delete f[k].done;delete f[k].at;delete f[k].q;f[k].ts=Date.now()});
    lsSet(FLAGS+flagLane(),f);if(flagLane()==="todo")queuePush();draw();return}
  if(t.id==="ab"){var v=$("ai").value.trim();if(!v)return;
    var m=lsGet(MINE+"todo",[]);
    m.push({k:"mine-"+Date.now(),who:v,ts:Date.now()});lsSet(MINE+"todo",m);
    queuePush();$("ai").value="";draw();return}
  if(t.dataset&&t.dataset.lane){lane=t.dataset.lane;location.hash="#"+lane;FEED=null;load();return}
  var li=t.closest&&t.closest("li.item");
  if(li&&t.dataset&&t.dataset.a){
    var k=li.getAttribute("data-k");
    if(li.getAttribute("data-mine")){
      var mm=lsGet(MINE+"todo",[]),from=null;
      mm.forEach(function(m){if(m.k===k){m.done=1;m.ts=Date.now();from=m.from||null}});
      lsSet(MINE+"todo",mm);
      if(from){var ii=lsGet(IDEAS,[]);ii.forEach(function(i){if(i.k===from&&i.todo){i.todo=0;i.ts=Date.now()}});lsSet(IDEAS,ii)}
      queuePush();draw();return}
    var src=null;
    (FEED&&FEED.sections||[]).forEach(function(s){(s.items||[]).forEach(function(i){
      if(keyOf(i)===k)src=i})});
    if(!src)return;
    var cur=flagsFor(src);
    setFlag(k,t.dataset.a,t.dataset.a==="done"?!isDone(src):!cur[t.dataset.a],src);draw();return}
});
window.addEventListener("hashchange",function(){
  var l=location.hash.slice(1);
  if((LANES.some(function(x){return x[0]===l})||l==="panel")&&l!==lane){lane=l;FEED=null;load()}});
function workPull(){if(!HQ||!localStorage.getItem(KEYSTORE))return;
  hqPost({action:"read_blob",kind:"work"}).then(function(r){if(!r.ok||!r.data||r.updated===lsGet("cc-work-at",""))return null;
    return decrypt(JSON.parse(r.data),localStorage.getItem(KEYSTORE)).then(function(w){lsSet("cc-work",w);lsSet("cc-work-at",r.updated);softDraw()})}).catch(function(){})}
var LAST_TICK=0;
function comeBack(){if(!FEED)return;workPull();if(Date.now()-FEED_AT>300000&&!typing()&&!busy){load();logSync();return}syncPull();logSync();loadGlance()}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")comeBack()});
document.addEventListener("input",function(ev){var t=ev.target;if(t&&t.id==="dlog"&&!LEDIT)lsSet(draftKey(DAYSEL||DAYSET||dk(eveDate())),t.value)});
document.addEventListener("focusout",function(){setTimeout(function(){if(PEND&&!typing()){PEND=0;draw()}},400)});
// keep the Lights Out countdown honest without stomping on typing
setInterval(function(){
  if((lane!=="hq"&&lane!=="panel")||!FEED)return;
  var a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))return;
  draw();
},60000);
load();
</script></body></html>
